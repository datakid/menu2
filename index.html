<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23080a10'/%3E%3Cpath d='M8.5 24V14.5a7.5 7.5 0 0 1 15 0V24' fill='none' stroke='%239aa3c8' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M13.5 24V15a2.5 2.5 0 0 1 5 0v9' fill='none' stroke='%237b93b8' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
<script>document.documentElement.classList.add('js');</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet" />
<style>
@property --a { syntax: '<color>'; inherits: true; initial-value: #9aa3c8; }
@property --b { syntax: '<color>'; inherits: true; initial-value: #7b93b8; }

:root {
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --font: 'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --pad: clamp(1.25rem, 4vw, 3.5rem);
  --wrap: 1280px;
}

body {
  --bg: #080a10;
  --bg-deep: #05070b;
  --text: #f1f1f5;
  --text-soft: #a5a7b8;
  --text-mute: #6a6d80;
  --hair: rgba(255, 255, 255, 0.09);
  --hair-strong: rgba(255, 255, 255, 0.22);
  --glass: rgba(255, 255, 255, 0.06);
  --glass-edge: rgba(255, 255, 255, 0.12);
  --dot: rgba(255, 255, 255, 0.17);
  --on-a: #080a10;
  --key: rgba(196, 205, 232, 0.12);
  --floor: rgba(0, 0, 0, 0.4);
  --vig: rgba(0, 0, 0, 0.6);
  --blob-op: 0.15;
  --halo-mix: 13%;
  --live: #4cc79a;
  --a: #9aa3c8;
  --b: #7b93b8;
  color-scheme: dark;
}

body[data-theme="light"] {
  --bg: #e9ebf0;
  --bg-deep: #dfe2e9;
  --text: #0e1018;
  --text-soft: #4c4f63;
  --text-mute: #878aa0;
  --hair: rgba(14, 16, 24, 0.12);
  --hair-strong: rgba(14, 16, 24, 0.28);
  --glass: rgba(255, 255, 255, 0.62);
  --glass-edge: rgba(14, 16, 24, 0.12);
  --dot: rgba(14, 16, 24, 0.18);
  --on-a: #ffffff;
  --key: rgba(255, 255, 255, 0.9);
  --floor: rgba(40, 46, 70, 0.07);
  --vig: rgba(40, 46, 70, 0.18);
  --blob-op: 0.2;
  --halo-mix: 12%;
  --live: #178f64;
  --a: #4b5393;
  --b: #5d7ea6;
  color-scheme: light;
}

body[data-theme="dark"][data-active="create"] { --a: #a597e6; --b: #c58fbd; }
body[data-theme="dark"][data-active="resume"] { --a: #67bdb4; --b: #7396d9; }
body[data-theme="dark"][data-active="exit"] { --a: #e5897d; --b: #dca978; }
body[data-theme="light"][data-active="create"] { --a: #5a4fb8; --b: #a65a92; }
body[data-theme="light"][data-active="resume"] { --a: #1a7a72; --b: #3e66b5; }
body[data-theme="light"][data-active="exit"] { --a: #b24a3f; --b: #b87b34; }

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
html { overflow-x: clip; }
body {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow-x: clip;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-optical-sizing: auto;
  transition: --a 0.9s var(--ease), --b 0.9s var(--ease), opacity 0.35s linear;
}
body.no-tx, body.no-tx * { transition: none !important; }
body.leaving { opacity: 0; }

html.js:not(.ready) :is(.topbar, .intro, .row) { visibility: hidden; }

.field {
  position: fixed;
  inset: 0;
  z-index: -4;
  overflow: hidden;
  background:
    radial-gradient(64% 52% at 50% -6%, var(--key) 0%, transparent 72%),
    radial-gradient(46% 38% at 50% -2%, color-mix(in srgb, var(--a) 9%, transparent) 0%, transparent 75%),
    radial-gradient(90% 60% at 50% 125%, color-mix(in srgb, var(--b) 8%, transparent), transparent 70%),
    var(--bg-deep);
}
.field::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 52%, var(--floor) 100%);
}
.blob { position: absolute; border-radius: 50%; filter: blur(170px); opacity: var(--blob-op); will-change: transform; aspect-ratio: 1; }
.blob-a { width: min(48vw, 640px); top: -20%; left: -14%; background: var(--a); animation: drift-a 46s ease-in-out infinite; }
.blob-b { width: min(42vw, 560px); bottom: -28%; right: -12%; background: var(--b); animation: drift-b 52s ease-in-out infinite; }
@keyframes drift-a { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(5%, 7%) scale(1.05); } }
@keyframes drift-b { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-6%, -5%) scale(1.03); } }

.vignette {
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background: radial-gradient(125% 105% at 50% 36%, transparent 42%, var(--vig) 100%);
}

.halo {
  position: fixed;
  left: 0;
  top: 0;
  width: 960px;
  height: 960px;
  margin: -480px 0 0 -480px;
  border-radius: 50%;
  pointer-events: none;
  z-index: -3;
  background: radial-gradient(circle, color-mix(in srgb, var(--a) var(--halo-mix), transparent) 0%, transparent 62%);
  transform: translate3d(50vw, 40vh, 0);
  will-change: transform;
}

.grid {
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background-image: radial-gradient(circle at center, var(--dot) 1px, transparent 1.6px);
  background-size: 30px 30px;
  -webkit-mask-image: radial-gradient(circle 300px at var(--gx, 50vw) var(--gy, 40vh), #000 0%, transparent 100%);
  mask-image: radial-gradient(circle 300px at var(--gx, 50vw) var(--gy, 40vh), #000 0%, transparent 100%);
}

.noise {
  position: fixed;
  inset: 0;
  z-index: -1;
  opacity: 0.055;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

.topbar {
  width: 100%;
  max-width: calc(var(--wrap) + 2 * var(--pad));
  margin: 0 auto;
  padding: clamp(1.25rem, 3vh, 2rem) var(--pad) 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.brand { display: flex; align-items: center; gap: 0.7rem; }
.mark { width: 22px; height: 26px; overflow: visible; }
.brand-name { font-size: 1.08rem; font-weight: 650; font-stretch: 88%; letter-spacing: -0.02em; }

.controls { display: flex; align-items: center; gap: 0.9rem; }

.status {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  height: 38px;
  padding: 0 1rem;
  border-radius: 999px;
  border: 1px solid var(--hair);
  font-size: 0.8rem;
  font-weight: 450;
  color: var(--text-soft);
}
.pulse {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--live);
  animation: ping 2.4s ease-out infinite;
}
@keyframes ping {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--live) 55%, transparent); }
  70%, 100% { box-shadow: 0 0 0 9px transparent; }
}

.theme-switch {
  --i: 2;
  position: relative;
  display: flex;
  gap: 2px;
  padding: 3px;
  border-radius: 999px;
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
}
.theme-thumb {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--text);
  transform: translateX(calc(var(--i) * 32px));
  transition: transform 0.55s var(--ease-out);
}
.theme-btn {
  position: relative;
  z-index: 1;
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--text-mute);
  font-size: 0.74rem;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: color 0.35s var(--ease);
}
.theme-btn:hover { color: var(--text); }
.theme-btn.active, .theme-btn.active:hover { color: var(--bg); }
.theme-btn:focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }

.stage {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: calc(var(--wrap) + 2 * var(--pad));
  margin: 0 auto;
  padding: 0 var(--pad) clamp(1.25rem, 3.5vh, 2.5rem);
}

.intro { padding: clamp(1.75rem, 5vh, 3.25rem) 0 clamp(1.25rem, 3.5vh, 2.25rem); }
.greeting { font-size: clamp(1.3rem, 1.9vw, 1.7rem); font-weight: 500; letter-spacing: -0.025em; line-height: 1.15; }
.sub { margin-top: 0.35rem; font-size: clamp(1rem, 1.3vw, 1.15rem); color: var(--text-mute); letter-spacing: -0.01em; }

.index { flex: 1; display: flex; flex-direction: column; border-top: 1px solid var(--hair); }

.row {
  position: relative;
  flex: 1 1 0;
  min-height: clamp(130px, 17vh, 230px);
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.5rem;
  padding: 1.25rem 0.25rem;
  border: 0;
  border-bottom: 1px solid var(--hair);
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  isolation: isolate;
  transition: opacity 0.6s var(--ease);
}
.index.has-on .row:not(.is-on) { opacity: 0.28; }
.row:focus-visible { outline: 2px solid var(--a); outline-offset: -2px; }

.row-fill {
  position: absolute;
  top: 0;
  bottom: 0;
  left: calc(50% - 50vw);
  right: calc(50% - 50vw);
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(90deg, color-mix(in srgb, var(--a) 13%, transparent) 0%, color-mix(in srgb, var(--b) 5%, transparent) 52%, transparent 100%);
  clip-path: inset(0 100% 0 0);
  transition: clip-path 0.85s var(--ease);
}
.row.is-on .row-fill { clip-path: inset(0 0 0 0); }

.row::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 1px;
  background: linear-gradient(90deg, var(--a), var(--b) 55%, transparent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.95s var(--ease);
}
.row.is-on::after { transform: scaleX(1); }

.row-main { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 2rem; }

.row-name {
  display: block;
  overflow: hidden;
  padding: 0.04em 0 0.1em;
  margin: -0.04em 0 -0.1em;
  font-size: clamp(2.6rem, 7.2vw, 6.8rem);
  font-weight: 700;
  font-stretch: 78%;
  line-height: 0.98;
  letter-spacing: -0.045em;
  transition: transform 0.8s var(--ease-out);
}
.row.is-on .row-name { transform: translateX(clamp(0.5rem, 1.4vw, 1.5rem)); }
.row-name-in {
  display: inline-block;
  padding-right: 0.06em;
  color: var(--text);
  background: linear-gradient(90deg, var(--text) 0%, var(--text) 40%, var(--a) 70%, var(--b) 100%);
  background-size: 250% 100%;
  background-position: 0% 0;
  transition: background-position 0.9s var(--ease);
}
@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  .row-name-in { -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
}
.row.is-on .row-name-in { background-position: 100% 0; }

.row-caption {
  max-width: 22ch;
  font-size: 0.98rem;
  font-weight: 450;
  line-height: 1.4;
  letter-spacing: -0.005em;
  color: var(--text-soft);
  text-align: right;
  transition: color 0.4s var(--ease);
}
.row.is-on .row-caption { color: var(--text); }

.row-end { flex: 0 0 auto; display: flex; align-items: center; gap: 1rem; }

kbd {
  min-width: 1.9rem;
  padding: 0.22rem 0.5rem;
  border: 1px solid var(--hair);
  border-radius: 8px;
  font: inherit;
  font-size: 0.78rem;
  font-weight: 500;
  text-align: center;
  color: var(--text-mute);
  transition: color 0.4s var(--ease), border-color 0.4s var(--ease);
}
.row.is-on kbd { color: var(--text); border-color: var(--hair-strong); }

.row-go {
  width: clamp(46px, 4.6vw, 64px);
  aspect-ratio: 1;
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: 1px solid var(--hair-strong);
  color: var(--text-soft);
  font-size: 1rem;
  transition: background 0.5s var(--ease), border-color 0.5s var(--ease), color 0.4s var(--ease), transform 0.6s var(--ease-out), box-shadow 0.6s var(--ease);
}
.row-go i { transition: transform 0.6s var(--ease-out); }
.row.is-on .row-go {
  background: var(--a);
  border-color: var(--a);
  color: var(--on-a);
  transform: scale(1.06);
  box-shadow: 0 0 0 7px color-mix(in srgb, var(--a) 11%, transparent);
}
.row.is-on .row-go i { transform: rotate(-45deg); }
.row-exit.is-on .row-go i { transform: none; }
.row:active .row-go { transform: scale(0.94); }

::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
::view-transition-old(root) { z-index: 1; }
::view-transition-new(root) { z-index: 2; }

@media (hover: none) {
  kbd { display: none; }
  .halo { display: none; }
  .grid { -webkit-mask-image: radial-gradient(ellipse 80% 50% at 50% 24%, #000 0%, transparent 100%); mask-image: radial-gradient(ellipse 80% 50% at 50% 24%, #000 0%, transparent 100%); }
}

@media (max-width: 820px) {
  .row-main { flex-direction: column; align-items: flex-start; justify-content: center; gap: 0.7rem; }
  .row-caption { text-align: left; max-width: 30ch; }
  .row { gap: 1rem; }
  kbd { display: none; }
}

@media (max-width: 560px) {
  .status { width: 38px; padding: 0; justify-content: center; }
  .status-text { display: none; }
  .controls { gap: 0.6rem; }
}

@media (prefers-reduced-motion: reduce) {
  .blob, .pulse { animation: none; }
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}
</style>
</head>
<body data-theme="dark">
<div class="field">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
</div>
<div class="halo" id="halo"></div>
<div class="vignette"></div>
<div class="grid" id="grid"></div>
<div class="noise" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 28" aria-hidden="true">
      <defs>
        <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" style="stop-color: var(--a)"></stop>
          <stop offset="1" style="stop-color: var(--b)"></stop>
        </linearGradient>
      </defs>
      <path d="M2.5 26V12.5a9.5 9.5 0 0 1 19 0V26" fill="none" stroke="url(#markGrad)" stroke-width="2.4" stroke-linecap="round"></path>
      <path d="M8.5 26V13.5a3.5 3.5 0 0 1 7 0V26" fill="none" stroke="url(#markGrad)" stroke-width="2.4" stroke-linecap="round"></path>
    </svg>
    <span class="brand-name">Portal</span>
  </div>
  <div class="controls">
    <div class="status" role="status">
      <span class="pulse"></span>
      <span class="status-text">Encrypted connection</span>
    </div>
    <div class="theme-switch" id="themeSwitch" role="group" aria-label="Theme">
      <span class="theme-thumb"></span>
      <button class="theme-btn" data-theme="system" aria-label="System theme" aria-pressed="false"><i class="fas fa-circle-half-stroke"></i></button>
      <button class="theme-btn" data-theme="light" aria-label="Light theme" aria-pressed="false"><i class="fas fa-sun"></i></button>
      <button class="theme-btn active" data-theme="dark" aria-label="Dark theme" aria-pressed="true"><i class="fas fa-moon"></i></button>
    </div>
  </div>
</header>

<main class="stage">
  <div class="intro">
    <h1 class="greeting" id="greeting">Welcome back</h1>
    <p class="sub">Choose where to go next.</p>
  </div>

  <nav class="index" id="index" aria-label="Portal actions">
    <a href="https://finalapp-nine.vercel.app/" class="row" target="_blank" rel="noopener" data-tone="create" data-key="1">
      <span class="row-fill"></span>
      <span class="row-main">
        <span class="row-name"><span class="row-name-in">New draft</span></span>
        <span class="row-caption">Launch a new integration canvas</span>
      </span>
      <span class="row-end">
        <kbd aria-hidden="true">1</kbd>
        <span class="row-go"><i class="fas fa-arrow-right"></i></span>
      </span>
    </a>

    <a href="https://dashboard2-iota.vercel.app/" class="row" target="_blank" rel="noopener" data-tone="resume" data-key="2">
      <span class="row-fill"></span>
      <span class="row-main">
        <span class="row-name"><span class="row-name-in">Active workspace</span></span>
        <span class="row-caption">Resume your current projects</span>
      </span>
      <span class="row-end">
        <kbd aria-hidden="true">2</kbd>
        <span class="row-go"><i class="fas fa-arrow-right"></i></span>
      </span>
    </a>

    <button type="button" class="row row-exit" id="exitRow" data-tone="exit" data-key="3">
      <span class="row-fill"></span>
      <span class="row-main">
        <span class="row-name"><span class="row-name-in">End session</span></span>
        <span class="row-caption">Securely disconnect this environment</span>
      </span>
      <span class="row-end">
        <kbd aria-hidden="true">3</kbd>
        <span class="row-go"><i class="fas fa-power-off"></i></span>
      </span>
    </button>
  </nav>
</main>

<script>
const root = document.documentElement;
const body = document.body;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const lightQuery = matchMedia('(prefers-color-scheme: light)');
const STORE_KEY = 'lx-portal-theme';
const modes = ['system', 'light', 'dark'];
const themeSwitch = document.getElementById('themeSwitch');
const themeBtns = [...document.querySelectorAll('.theme-btn')];

function readStore() {
  try { return localStorage.getItem(STORE_KEY); } catch (e) { return null; }
}
function writeStore(value) {
  try { localStorage.setItem(STORE_KEY, value); } catch (e) {}
}

function applyTheme(theme) {
  const resolved = theme === 'system' ? (lightQuery.matches ? 'light' : 'dark') : theme;
  body.setAttribute('data-theme', resolved);
  themeSwitch.style.setProperty('--i', Math.max(0, modes.indexOf(theme)));
  themeBtns.forEach(btn => {
    const on = btn.dataset.theme === theme;
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-pressed', String(on));
  });
  writeStore(theme);
}

let currentTheme = modes.includes(readStore()) ? readStore() : 'dark';
applyTheme(currentTheme);

function changeTheme(theme, x, y) {
  if (theme === currentTheme) return;
  currentTheme = theme;
  if (!document.startViewTransition || reduceMotion) {
    applyTheme(theme);
    return;
  }
  body.classList.add('no-tx');
  const radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const transition = document.startViewTransition(() => applyTheme(theme));
  transition.ready.then(() => {
    root.animate(
      { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${radius}px at ${x}px ${y}px)`] },
      { duration: 800, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', pseudoElement: '::view-transition-new(root)' }
    );
  }).catch(() => {});
  transition.finished.finally(() => body.classList.remove('no-tx'));
}

themeBtns.forEach(btn => btn.addEventListener('click', () => {
  const rect = btn.getBoundingClientRect();
  changeTheme(btn.dataset.theme, rect.left + rect.width / 2, rect.top + rect.height / 2);
}));
lightQuery.addEventListener('change', () => {
  if (currentTheme === 'system') applyTheme('system');
});

const hour = new Date().getHours();
document.getElementById('greeting').textContent =
  hour < 5 ? 'Working late' : hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';

const index = document.getElementById('index');
const rows = [...index.querySelectorAll('.row')];
let hovered = null;
let focused = null;

function syncActive() {
  const row = hovered || focused;
  rows.forEach(r => r.classList.toggle('is-on', r === row));
  index.classList.toggle('has-on', !!row);
  if (row) body.dataset.active = row.dataset.tone;
  else delete body.dataset.active;
}

rows.forEach(row => {
  row.addEventListener('pointerenter', e => {
    if (e.pointerType === 'touch') return;
    hovered = row;
    syncActive();
  });
  row.addEventListener('focus', () => {
    if (!row.matches(':focus-visible')) return;
    focused = row;
    syncActive();
  });
  row.addEventListener('blur', () => {
    if (focused === row) focused = null;
    syncActive();
  });
});
index.addEventListener('pointerleave', () => {
  hovered = null;
  syncActive();
});

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey || e.repeat) return;
  const row = rows.find(r => r.dataset.key === e.key);
  if (!row) return;
  e.preventDefault();
  row.click();
});

const halo = document.getElementById('halo');
const grid = document.getElementById('grid');
let targetX = innerWidth * 0.5;
let targetY = innerHeight * 0.4;
let posX = targetX;
let posY = targetY;
let frame = 0;

function paintPointer() {
  halo.style.transform = `translate3d(${posX}px, ${posY}px, 0)`;
  grid.style.setProperty('--gx', posX + 'px');
  grid.style.setProperty('--gy', posY + 'px');
}

function tick() {
  const ease = reduceMotion ? 1 : 0.13;
  posX += (targetX - posX) * ease;
  posY += (targetY - posY) * ease;
  paintPointer();
  if (Math.abs(targetX - posX) > 0.3 || Math.abs(targetY - posY) > 0.3) frame = requestAnimationFrame(tick);
  else frame = 0;
}

window.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  targetX = e.clientX;
  targetY = e.clientY;
  if (!frame) frame = requestAnimationFrame(tick);
});
paintPointer();

let leaving = false;
function leave() {
  if (leaving) return;
  leaving = true;
  const finish = () => {
    window.close();
    window.location.href = 'about:blank';
  };
  if (!window.gsap || reduceMotion) {
    body.classList.add('leaving');
    setTimeout(finish, reduceMotion ? 0 : 400);
    return;
  }
  gsap.timeline({ onComplete: finish })
    .to('.row', { opacity: 0, y: -14, scale: 0.985, filter: 'blur(8px)', duration: 0.45, stagger: 0.07, ease: 'power2.in' })
    .to('.intro, .topbar', { opacity: 0, duration: 0.3 }, '-=0.3')
    .to('.field, .halo, .grid, .noise', { opacity: 0, duration: 0.5 }, '-=0.25');
}
document.getElementById('exitRow').addEventListener('click', leave);

document.addEventListener('DOMContentLoaded', () => {
  if (!window.gsap || reduceMotion) {
    root.classList.add('ready');
    return;
  }
  gsap.set('.topbar', { opacity: 0, y: -14 });
  gsap.set('.intro > *', { opacity: 0, y: 16 });
  gsap.set('.row', { opacity: 0 });
  gsap.set('.row-name-in', { yPercent: 112 });
  gsap.set('.row-caption, .row-end', { opacity: 0, x: 18 });
  gsap.set('.field', { opacity: 0 });
  root.classList.add('ready');

  gsap.timeline({ defaults: { ease: 'power3.out' } })
    .to('.field', { opacity: 1, duration: 1.8, ease: 'power1.out' }, 0)
    .to('.topbar', { opacity: 1, y: 0, duration: 0.8, clearProps: 'opacity,transform' }, 0.1)
    .to('.intro > *', { opacity: 1, y: 0, duration: 0.8, stagger: 0.08, clearProps: 'opacity,transform' }, 0.25)
    .to('.row', { opacity: 1, duration: 0.6, stagger: 0.12, clearProps: 'opacity' }, 0.4)
    .to('.row-name-in', { yPercent: 0, duration: 1.1, stagger: 0.12, ease: 'expo.out', clearProps: 'transform' }, 0.45)
    .to('.row-caption, .row-end', { opacity: 1, x: 0, duration: 0.8, stagger: 0.06, clearProps: 'opacity,transform' }, 0.7);
});
</script>
</body>
</html>
