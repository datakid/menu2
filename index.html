<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LX Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg-0: #0c0c10;
  --bg-1: #08080b;
  --card-bg: rgba(255,255,255,0.03);
  --card-border: rgba(255,255,255,0.08);
  --text: #f4f3f1;
  --text-dim: #8b899a;
  --text-faint: #55536b;
  --accent: #8f8bff;
  --danger: #e2686a;
  --spot: rgba(255,255,255,0.4);
  --spot-blend: soft-light;
  --bevel: linear-gradient(155deg, rgba(255,255,255,0.4), rgba(255,255,255,0.03) 45%, rgba(255,255,255,0.14) 100%);
  --blob-a: #6d5ce0;
  --blob-b: #3fb0d4;
  --blob-c: #d98bb0;
  --blob-op: 0.22;
  --ease: cubic-bezier(0.19,1,0.22,1);
}

body[data-theme="light"] {
  --bg-0: #ffffff;
  --bg-1: #f6f5f2;
  --card-bg: rgba(255,255,255,0.55);
  --card-border: rgba(20,18,25,0.08);
  --text: #16151a;
  --text-dim: #68667a;
  --text-faint: #aeacbb;
  --accent: #5b4fd6;
  --danger: #c4453f;
  --spot: rgba(91,79,214,0.08);
  --spot-blend: normal;
  --bevel: linear-gradient(155deg, rgba(20,18,25,0.16), rgba(20,18,25,0.02) 45%, rgba(20,18,25,0.08) 100%);
  --blob-a: #b7abf5;
  --blob-b: #a6dde8;
  --blob-c: #f2c3d6;
  --blob-op: 0.4;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

body {
  min-height: 100vh;
  background: var(--bg-1);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  display: flex;
  flex-direction: column;
  transition: background-color 0.6s var(--ease), color 0.6s var(--ease);
  overflow-x: hidden;
}

.liquid-field {
  position: fixed;
  inset: 0;
  z-index: -1;
  filter: blur(110px);
  transition: opacity 0.6s var(--ease);
}

.blob { position: absolute; border-radius: 50%; opacity: var(--blob-op); }
.blob-a { width: 46vw; height: 46vw; top: -14%; left: -10%; background: var(--blob-a); animation: drift-a 26s ease-in-out infinite; }
.blob-b { width: 40vw; height: 40vw; bottom: -16%; right: -8%; background: var(--blob-b); animation: drift-b 30s ease-in-out infinite; }
.blob-c { width: 32vw; height: 32vw; top: 30%; left: 62%; background: var(--blob-c); animation: drift-c 22s ease-in-out infinite; }

@keyframes drift-a { 0%,100% { transform: translate(0,0); } 50% { transform: translate(5%,8%); } }
@keyframes drift-b { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-6%,-5%); } }
@keyframes drift-c { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-8%,6%); } }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2.2rem 3rem 0;
  visibility: hidden;
}

.wordmark {
  font-size: 0.72rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-faint);
  font-weight: 500;
}

.theme-switch {
  display: flex;
  gap: 0.15rem;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 100px;
  padding: 3px;
  backdrop-filter: blur(12px);
}

.theme-btn {
  background: transparent;
  border: none;
  color: var(--text-faint);
  width: 28px; height: 28px;
  border-radius: 100px;
  cursor: pointer;
  font-size: 0.74rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.4s var(--ease);
}

.theme-btn.active { background: var(--text); color: var(--bg-1); }
.theme-btn:hover:not(.active) { color: var(--text); }
.theme-btn:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 2rem;
}

.wrap { width: 100%; max-width: 1080px; }

.title {
  font-size: 1.8rem;
  font-weight: 500;
  letter-spacing: -0.02em;
  margin-bottom: 1.75rem;
  visibility: hidden;
}

.title span { color: var(--text-faint); }

.bento {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 1rem;
  height: clamp(460px, 62vh, 620px);
}

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-decoration: none;
  color: inherit;
  padding: 2.4rem;
  border-radius: 22px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  backdrop-filter: blur(20px) saturate(140%);
  overflow: hidden;
  visibility: hidden;
  transition: backdrop-filter 0.5s var(--ease), box-shadow 0.5s var(--ease), transform 0.5s var(--ease);
}

.card-draft { grid-column: 1; grid-row: 1 / span 2; }
.card-workspace { grid-column: 2; grid-row: 1; }
.card-exit { grid-column: 2; grid-row: 2; }

.card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: var(--bevel);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0.65;
  transition: opacity 0.5s var(--ease);
  pointer-events: none;
}

.card:hover::after { opacity: 1; }

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle 240px at var(--mx,50%) var(--my,50%), var(--spot), transparent 72%);
  mix-blend-mode: var(--spot-blend);
  opacity: 0;
  transition: opacity 0.45s var(--ease);
  pointer-events: none;
}

.card:hover::before { opacity: 1; }

.card:hover {
  backdrop-filter: blur(28px) saturate(180%);
  box-shadow: 0 30px 60px rgba(0,0,0,0.35);
  transform: translateY(-2px);
}

body[data-theme="light"] .card:hover { box-shadow: 0 24px 48px rgba(20,18,25,0.1); }

.watermark {
  position: absolute;
  right: -0.8rem;
  bottom: -1.4rem;
  font-size: 10rem;
  color: var(--text);
  opacity: 0.04;
  transition: transform 0.7s var(--ease), opacity 0.5s var(--ease);
  pointer-events: none;
}

.card:hover .watermark { transform: translate(-8px,-8px); opacity: 0.075; }

.card-tag {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  color: var(--text-faint);
  z-index: 1;
}

.card:hover .card-tag { color: var(--text-dim); }

.card-body { position: relative; z-index: 1; }

.card-name {
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 0.5rem;
  color: var(--text);
}

.card-draft .card-name { font-size: 2.2rem; }
.card-workspace .card-name, .card-exit .card-name { font-size: 1.25rem; }

.card-caption {
  font-size: 0.92rem;
  color: var(--text-dim);
  max-width: 32ch;
  line-height: 1.5;
}

.card-draft .card-caption { font-size: 1rem; max-width: 26ch; }

.card-arrow {
  position: absolute;
  bottom: 2rem;
  right: 2.1rem;
  font-size: 0.85rem;
  color: var(--text-faint);
  opacity: 0;
  transform: translateX(-6px);
  transition: all 0.4s var(--ease);
  z-index: 1;
}

.card:hover .card-arrow { opacity: 1; transform: translateX(0); color: var(--accent); }

#exitCard:hover .card-arrow { color: var(--danger); }
#exitCard:hover::after { background: linear-gradient(155deg, rgba(226,104,106,0.45), rgba(226,104,106,0.05) 45%, rgba(226,104,106,0.2) 100%); }

.footer {
  text-align: center;
  padding: 1.6rem;
  font-size: 0.68rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-faint);
  visibility: hidden;
}

@media (max-width: 720px) {
  .bento { grid-template-columns: 1fr; grid-template-rows: none; height: auto; gap: 0.7rem; }
  .card-draft, .card-workspace, .card-exit { grid-column: 1; grid-row: auto; }
  .card-draft { min-height: 190px; }
  .card-workspace, .card-exit { min-height: 140px; }
  .card-draft .card-name { font-size: 1.7rem; }
  .topbar { padding: 1.6rem 1.6rem 0; }
  .stage { padding: 1.5rem 1.4rem; }
  .watermark { font-size: 7rem; }
}

@media (prefers-reduced-motion: reduce) {
  .blob { animation: none; }
  * { transition-duration: 0.01ms !important; }
}
</style>
</head>
<body data-theme="dark">
<div class="liquid-field">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div class="blob blob-c"></div>
</div>

<header class="topbar gsap-bar">
  <span class="wordmark">Linkexpress</span>
  <div class="theme-switch">
    <button class="theme-btn" data-theme="system" aria-label="System theme"><i class="fas fa-circle-half-stroke"></i></button>
    <button class="theme-btn" data-theme="light" aria-label="Light theme"><i class="fas fa-sun"></i></button>
    <button class="theme-btn active" data-theme="dark" aria-label="Dark theme"><i class="fas fa-moon"></i></button>
  </div>
</header>

<main class="stage">
  <div class="wrap">
    <h1 class="title gsap-title"><span>Portal</span> Access</h1>

    <div class="bento">
      <a href="https://finalapp-nine.vercel.app/" class="card card-draft gsap-card" target="_blank">
        <span class="card-tag"><i class="fas fa-layer-group"></i>CREATE</span>
        <div class="card-body">
          <div class="card-name">Initialize Draft</div>
          <div class="card-caption">Launch a new integration canvas</div>
        </div>
        <i class="fas fa-layer-group watermark"></i>
        <i class="fas fa-arrow-right card-arrow"></i>
      </a>

      <a href="https://dashboard2-iota.vercel.app/" class="card card-workspace gsap-card" target="_blank">
        <span class="card-tag"><i class="fas fa-compass"></i>RESUME</span>
        <div class="card-body">
          <div class="card-name">Active Workspace</div>
          <div class="card-caption">Resume your current projects</div>
        </div>
        <i class="fas fa-compass watermark"></i>
        <i class="fas fa-arrow-right card-arrow"></i>
      </a>

      <a href="#" class="card card-exit gsap-card" id="exitCard">
        <span class="card-tag"><i class="fas fa-power-off"></i>EXIT</span>
        <div class="card-body">
          <div class="card-name">Terminate Session</div>
          <div class="card-caption">Securely disconnect environment</div>
        </div>
        <i class="fas fa-power-off watermark"></i>
        <i class="fas fa-arrow-right card-arrow"></i>
      </a>
    </div>
  </div>
</main>

<footer class="footer gsap-footer">Encrypted connection</footer>

<script>
const themeBtns = document.querySelectorAll('.theme-btn');

function applyTheme(theme) {
  const activeTheme = theme === 'system'
    ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    : theme;

  document.body.setAttribute('data-theme', activeTheme);

  themeBtns.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.theme === theme);
  });
  localStorage.setItem('portal-state', theme);
}

applyTheme(localStorage.getItem('portal-state') || 'dark');

themeBtns.forEach(btn => {
  btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
});

window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
  if (localStorage.getItem('portal-state') === 'system') applyTheme('system');
});

document.querySelectorAll('.card').forEach(card => {
  card.addEventListener('mousemove', (e) => {
    const rect = card.getBoundingClientRect();
    card.style.setProperty('--mx', `${e.clientX - rect.left}px`);
    card.style.setProperty('--my', `${e.clientY - rect.top}px`);
  });
});

document.addEventListener('DOMContentLoaded', () => {
  gsap.set(['.gsap-bar', '.gsap-title', '.gsap-card', '.gsap-footer'], { visibility: 'visible' });

  const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
  tl.fromTo('.gsap-bar', { y: -12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7 })
    .fromTo('.gsap-title', { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7 }, '-=0.45')
    .fromTo('.gsap-card', { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.75, stagger: 0.09 }, '-=0.45')
    .fromTo('.gsap-footer', { opacity: 0 }, { opacity: 1, duration: 0.6 }, '-=0.2');

  document.getElementById('exitCard').addEventListener('click', (e) => {
    e.preventDefault();

    const exitTl = gsap.timeline({
      onComplete: () => {
        window.close();
        if (window.location.href.includes('about:')) window.location.replace('about:blank');
        window.location.href = 'about:blank';
      }
    });

    exitTl.to('.gsap-card', { opacity: 0, y: -8, duration: 0.35, stagger: 0.05, ease: 'power2.in' })
      .to('.gsap-title, .gsap-footer', { opacity: 0, duration: 0.3 }, '-=0.25')
      .to('.gsap-bar', { opacity: 0, duration: 0.3 }, '-=0.3')
      .to('.liquid-field', { opacity: 0, duration: 0.4 }, '-=0.3');
  });
});
</script>
</body>
</html>
