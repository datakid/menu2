<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LX Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #07070a;
  --bg-deep: #030305;
  --glass: rgba(255,255,255,0.045);
  --glass-edge: rgba(255,255,255,0.14);
  --glass-inner: rgba(255,255,255,0.06);
  --text: #f5f4f2;
  --text-soft: #9a98a8;
  --text-mute: #5c5a6e;
  --accent: #a39fff;
  --danger: #e86d6f;
  --spot: rgba(255,255,255,0.55);
  --blob-a: #6b5ce7;
  --blob-b: #3aabb8;
  --blob-c: #c97ba8;
  --blob-op: 0.28;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --radius: 28px;
  --shadow: 0 24px 64px rgba(0,0,0,0.45), 0 2px 0 rgba(255,255,255,0.04) inset;
}

body[data-theme="light"] {
  --bg: #f3f2ee;
  --bg-deep: #ebe9e3;
  --glass: rgba(255,255,255,0.52);
  --glass-edge: rgba(20,18,30,0.1);
  --glass-inner: rgba(255,255,255,0.65);
  --text: #121118;
  --text-soft: #5f5d6e;
  --text-mute: #a8a6b5;
  --accent: #5a4fd4;
  --danger: #c9443f;
  --spot: rgba(90,79,212,0.12);
  --blob-a: #b8aef5;
  --blob-b: #a8dce6;
  --blob-c: #f0c2d4;
  --blob-op: 0.55;
  --shadow: 0 28px 56px rgba(20,18,30,0.08), 0 1px 0 rgba(255,255,255,0.8) inset;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

html, body { height: 100%; }

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  transition: background 0.7s var(--ease), color 0.7s var(--ease);
}

.field {
  position: fixed;
  inset: 0;
  z-index: -2;
  overflow: hidden;
  background: radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,0.03), transparent 55%), var(--bg-deep);
}

.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: var(--blob-op);
  will-change: transform;
}

.blob-a {
  width: min(52vw, 640px);
  height: min(52vw, 640px);
  top: -18%;
  left: -12%;
  background: var(--blob-a);
  animation: drift-a 28s ease-in-out infinite;
}

.blob-b {
  width: min(44vw, 540px);
  height: min(44vw, 540px);
  bottom: -20%;
  right: -10%;
  background: var(--blob-b);
  animation: drift-b 32s ease-in-out infinite;
}

.blob-c {
  width: min(34vw, 420px);
  height: min(34vw, 420px);
  top: 38%;
  left: 58%;
  background: var(--blob-c);
  animation: drift-c 24s ease-in-out infinite;
}

@keyframes drift-a {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(6%, 10%) scale(1.06); }
}

@keyframes drift-b {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-8%, -6%) scale(1.04); }
}

@keyframes drift-c {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-10%, 8%) scale(1.08); }
}

.noise {
  position: fixed;
  inset: 0;
  z-index: -1;
  opacity: 0.035;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

body[data-theme="light"] .noise { opacity: 0.04; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2rem 2.75rem 0;
  visibility: hidden;
}

.wordmark {
  font-size: 0.7rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--text-mute);
  font-weight: 500;
}

.theme-switch {
  display: flex;
  gap: 2px;
  padding: 3px;
  border-radius: 999px;
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset;
}

.theme-btn {
  width: 30px;
  height: 30px;
  border: none;
  border-radius: 999px;
  background: transparent;
  color: var(--text-mute);
  cursor: pointer;
  font-size: 0.72rem;
  display: grid;
  place-items: center;
  transition: color 0.35s var(--ease), background 0.35s var(--ease), transform 0.35s var(--ease);
}

.theme-btn:hover:not(.active) { color: var(--text); }
.theme-btn.active {
  background: var(--text);
  color: var(--bg);
  transform: scale(1.02);
}

.theme-btn:focus-visible,
.card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.75rem 1.75rem 2rem;
}

.wrap {
  width: 100%;
  max-width: 1040px;
}

.title {
  font-size: clamp(1.55rem, 2.4vw, 1.85rem);
  font-weight: 500;
  letter-spacing: -0.035em;
  margin-bottom: 1.6rem;
  visibility: hidden;
}

.title span { color: var(--text-mute); font-weight: 400; }

.bento {
  display: grid;
  grid-template-columns: 1.45fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 0.9rem;
  height: clamp(440px, 58vh, 580px);
}

.card {
  --mx: 50%;
  --my: 50%;
  --lift: 0px;
  --scale: 1;
  --distort: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-decoration: none;
  color: inherit;
  padding: 2.1rem 2.15rem;
  border-radius: var(--radius);
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  backdrop-filter: blur(28px) saturate(165%) brightness(1.05);
  -webkit-backdrop-filter: blur(28px) saturate(165%) brightness(1.05);
  box-shadow: var(--shadow);
  overflow: hidden;
  isolation: isolate;
  visibility: hidden;
  transform: translateY(var(--lift)) scale(var(--scale));
  transition:
    transform 0.55s var(--ease-out),
    backdrop-filter 0.55s var(--ease),
    -webkit-backdrop-filter 0.55s var(--ease),
    box-shadow 0.55s var(--ease),
    border-color 0.45s var(--ease),
    background 0.45s var(--ease);
  will-change: transform;
}

.card-draft { grid-column: 1; grid-row: 1 / span 2; }
.card-workspace { grid-column: 2; grid-row: 1; }
.card-exit { grid-column: 2; grid-row: 2; }

.card-glass {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  z-index: 0;
}

.card-glass::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.22) 0%,
      rgba(255,255,255,0.04) 28%,
      transparent 48%,
      rgba(255,255,255,0.03) 72%,
      rgba(255,255,255,0.1) 100%
    );
  opacity: 0.7;
  mix-blend-mode: soft-light;
  transition: opacity 0.5s var(--ease);
}

body[data-theme="light"] .card-glass::before {
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.85) 0%,
      rgba(255,255,255,0.2) 30%,
      transparent 50%,
      rgba(20,18,30,0.03) 100%
    );
  mix-blend-mode: normal;
  opacity: 0.9;
}

.card-glass::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.28),
    inset 0 -1px 0 rgba(0,0,0,0.12),
    inset 1px 0 0 rgba(255,255,255,0.08),
    inset -1px 0 0 rgba(255,255,255,0.04);
  transition: box-shadow 0.5s var(--ease);
}

.card-fluid {
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  background: radial-gradient(
    circle 220px at var(--mx) var(--my),
    var(--spot),
    transparent 68%
  );
  opacity: 0;
  mix-blend-mode: soft-light;
  transition: opacity 0.4s var(--ease);
  pointer-events: none;
  z-index: 1;
}

body[data-theme="light"] .card-fluid {
  mix-blend-mode: normal;
}

.card-ripple {
  position: absolute;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  left: var(--mx);
  top: var(--my);
  transform: translate(-50%, -50%) scale(0.2);
  background: radial-gradient(circle, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.05) 35%, transparent 70%);
  opacity: 0;
  pointer-events: none;
  z-index: 1;
  mix-blend-mode: soft-light;
}

body[data-theme="light"] .card-ripple {
  background: radial-gradient(circle, rgba(90,79,212,0.16) 0%, rgba(90,79,212,0.04) 40%, transparent 70%);
  mix-blend-mode: normal;
}

.card:hover {
  --lift: -4px;
  --scale: 1.012;
  backdrop-filter: blur(36px) saturate(190%) brightness(1.08);
  -webkit-backdrop-filter: blur(36px) saturate(190%) brightness(1.08);
  border-color: rgba(255,255,255,0.22);
  box-shadow:
    0 36px 80px rgba(0,0,0,0.5),
    0 0 0 1px rgba(255,255,255,0.05),
    0 2px 0 rgba(255,255,255,0.08) inset;
  filter: url(#liquid);
}

body[data-theme="light"] .card:hover {
  border-color: rgba(20,18,30,0.12);
  box-shadow:
    0 32px 64px rgba(20,18,30,0.12),
    0 0 0 1px rgba(255,255,255,0.5),
    0 1px 0 rgba(255,255,255,0.9) inset;
}

.card:hover .card-fluid { opacity: 1; }
.card:hover .card-glass::before { opacity: 1; }

.card:hover .card-ripple {
  animation: fluid-pulse 1.1s var(--ease-out) forwards;
}

@keyframes fluid-pulse {
  0% {
    opacity: 0.55;
    transform: translate(-50%, -50%) scale(0.15);
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(1.8);
  }
}

.card-tag {
  position: relative;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.64rem;
  letter-spacing: 0.16em;
  color: var(--text-mute);
  transition: color 0.4s var(--ease);
}

.card:hover .card-tag { color: var(--text-soft); }

.card-body {
  position: relative;
  z-index: 2;
}

.card-name {
  font-weight: 600;
  letter-spacing: -0.03em;
  color: var(--text);
  margin-bottom: 0.45rem;
  transition: letter-spacing 0.5s var(--ease);
}

.card-draft .card-name { font-size: clamp(1.85rem, 3vw, 2.25rem); }
.card-workspace .card-name,
.card-exit .card-name { font-size: 1.2rem; }

.card:hover .card-name { letter-spacing: -0.02em; }

.card-caption {
  font-size: 0.9rem;
  line-height: 1.5;
  color: var(--text-soft);
  max-width: 28ch;
}

.card-draft .card-caption {
  font-size: 0.98rem;
  max-width: 24ch;
}

.card-arrow {
  position: absolute;
  bottom: 1.85rem;
  right: 1.9rem;
  z-index: 2;
  width: 34px;
  height: 34px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  font-size: 0.78rem;
  color: var(--text-mute);
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  opacity: 0;
  transform: translateX(-8px) scale(0.92);
  transition:
    opacity 0.4s var(--ease),
    transform 0.45s var(--ease-out),
    color 0.35s var(--ease),
    background 0.35s var(--ease),
    border-color 0.35s var(--ease);
}

body[data-theme="light"] .card-arrow {
  background: rgba(20,18,30,0.03);
  border-color: rgba(20,18,30,0.08);
}

.card:hover .card-arrow {
  opacity: 1;
  transform: translateX(0) scale(1);
  color: var(--accent);
  background: rgba(163,159,255,0.1);
  border-color: rgba(163,159,255,0.22);
}

#exitCard:hover .card-arrow {
  color: var(--danger);
  background: rgba(232,109,111,0.1);
  border-color: rgba(232,109,111,0.22);
}

#exitCard:hover {
  border-color: rgba(232,109,111,0.28);
}

.mark {
  position: absolute;
  right: -0.4rem;
  bottom: -1rem;
  font-size: 9.5rem;
  color: var(--text);
  opacity: 0.028;
  z-index: 0;
  pointer-events: none;
  transition: transform 0.7s var(--ease-out), opacity 0.5s var(--ease);
}

.card:hover .mark {
  transform: translate(-10px, -10px) scale(1.03);
  opacity: 0.05;
}

.footer {
  text-align: center;
  padding: 0 1.5rem 1.5rem;
  font-size: 0.64rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-mute);
  visibility: hidden;
}

@media (max-width: 740px) {
  .bento {
    grid-template-columns: 1fr;
    grid-template-rows: none;
    height: auto;
    gap: 0.7rem;
  }

  .card-draft,
  .card-workspace,
  .card-exit {
    grid-column: 1;
    grid-row: auto;
  }

  .card-draft { min-height: 200px; }
  .card-workspace,
  .card-exit { min-height: 148px; }

  .card-draft .card-name { font-size: 1.7rem; }

  .topbar { padding: 1.4rem 1.35rem 0; }
  .stage { padding: 1.35rem 1.2rem 1.5rem; }
  .card { padding: 1.7rem 1.6rem; border-radius: 24px; }
  .mark { font-size: 7rem; }
}

@media (prefers-reduced-motion: reduce) {
  .blob { animation: none; }
  .card,
  .card-arrow,
  .card-fluid,
  .card-glass::before,
  .theme-btn {
    transition-duration: 0.01ms !important;
  }
  .card:hover { filter: none; }
  .card:hover .card-ripple { animation: none; }
}
</style>
</head>
<body data-theme="dark">
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="liquid" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="3" result="noise">
        <animate attributeName="baseFrequency" dur="8s" values="0.012 0.018;0.016 0.014;0.012 0.018" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>

<div class="field">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div class="blob blob-c"></div>
</div>
<div class="noise" aria-hidden="true"></div>

<header class="topbar gsap-bar">
  <span class="wordmark">Linkexpress</span>
  <div class="theme-switch">
    <button class="theme-btn" data-theme="system" aria-label="System theme"><i class="fas fa-circle-half-stroke"></i></button>
    <button class="theme-btn" data-theme="light" aria-label="Light theme"><i class="fas fa-sun"></i></button>
    <button class="theme-btn active" data-theme="dark" aria-label="Dark theme"><i class="fas fa-moon"></i></button>
  </div>
</header>

<main class="stage">
  <div class="wrap">
    <h1 class="title gsap-title"><span>Portal</span> Access</h1>

    <div class="bento">
      <a href="https://finalapp-nine.vercel.app/" class="card card-draft gsap-card" target="_blank" rel="noopener">
        <div class="card-glass"></div>
        <div class="card-fluid"></div>
        <div class="card-ripple"></div>
        <span class="card-tag"><i class="fas fa-layer-group"></i>CREATE</span>
        <div class="card-body">
          <div class="card-name">Initialize Draft</div>
          <div class="card-caption">Launch a new integration canvas</div>
        </div>
        <i class="fas fa-layer-group mark"></i>
        <span class="card-arrow"><i class="fas fa-arrow-right"></i></span>
      </a>

      <a href="https://dashboard2-iota.vercel.app/" class="card card-workspace gsap-card" target="_blank" rel="noopener">
        <div class="card-glass"></div>
        <div class="card-fluid"></div>
        <div class="card-ripple"></div>
        <span class="card-tag"><i class="fas fa-compass"></i>RESUME</span>
        <div class="card-body">
          <div class="card-name">Active Workspace</div>
          <div class="card-caption">Resume your current projects</div>
        </div>
        <i class="fas fa-compass mark"></i>
        <span class="card-arrow"><i class="fas fa-arrow-right"></i></span>
      </a>

      <a href="#" class="card card-exit gsap-card" id="exitCard">
        <div class="card-glass"></div>
        <div class="card-fluid"></div>
        <div class="card-ripple"></div>
        <span class="card-tag"><i class="fas fa-power-off"></i>EXIT</span>
        <div class="card-body">
          <div class="card-name">Terminate Session</div>
          <div class="card-caption">Securely disconnect environment</div>
        </div>
        <i class="fas fa-power-off mark"></i>
        <span class="card-arrow"><i class="fas fa-arrow-right"></i></span>
      </a>
    </div>
  </div>
</main>

<footer class="footer gsap-footer">Encrypted connection</footer>

<script>
const themeBtns = document.querySelectorAll('.theme-btn');

function applyTheme(theme) {
  const activeTheme = theme === 'system'
    ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    : theme;

  document.body.setAttribute('data-theme', activeTheme);

  themeBtns.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.theme === theme);
  });

  localStorage.setItem('portal-state', theme);
}

applyTheme(localStorage.getItem('portal-state') || 'dark');

themeBtns.forEach(btn => {
  btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
});

window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
  if (localStorage.getItem('portal-state') === 'system') applyTheme('system');
});

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

document.querySelectorAll('.card').forEach(card => {
  const fluid = card.querySelector('.card-fluid');
  const ripple = card.querySelector('.card-ripple');
  let rect;

  const updateRect = () => { rect = card.getBoundingClientRect(); };

  card.addEventListener('mouseenter', () => {
    updateRect();
    if (!reduceMotion && ripple) {
      ripple.style.animation = 'none';
      void ripple.offsetWidth;
      ripple.style.animation = '';
    }
  });

  card.addEventListener('mousemove', (e) => {
    if (!rect) updateRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    card.style.setProperty('--mx', `${x}px`);
    card.style.setProperty('--my', `${y}px`);
  });

  card.addEventListener('mouseleave', () => {
    card.style.setProperty('--mx', '50%');
    card.style.setProperty('--my', '50%');
  });

  window.addEventListener('resize', updateRect);
});

document.addEventListener('DOMContentLoaded', () => {
  gsap.set(['.gsap-bar', '.gsap-title', '.gsap-card', '.gsap-footer'], { visibility: 'visible' });

  if (reduceMotion) {
    gsap.set(['.gsap-bar', '.gsap-title', '.gsap-card', '.gsap-footer'], { opacity: 1, y: 0 });
    return;
  }

  const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

  tl.fromTo('.gsap-bar', { y: -14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.75 })
    .fromTo('.gsap-title', { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7 }, '-=0.5')
    .fromTo('.gsap-card', { y: 28, opacity: 0, scale: 0.97 }, {
      y: 0,
      opacity: 1,
      scale: 1,
      duration: 0.85,
      stagger: 0.1,
      ease: 'power3.out'
    }, '-=0.45')
    .fromTo('.gsap-footer', { opacity: 0 }, { opacity: 1, duration: 0.55 }, '-=0.25');

  document.getElementById('exitCard').addEventListener('click', (e) => {
    e.preventDefault();

    const exitTl = gsap.timeline({
      onComplete: () => {
        window.close();
        window.location.href = 'about:blank';
      }
    });

    exitTl
      .to('.gsap-card', {
        opacity: 0,
        y: -12,
        scale: 0.96,
        filter: 'blur(8px)',
        duration: 0.4,
        stagger: 0.06,
        ease: 'power2.in'
      })
      .to('.gsap-title, .gsap-footer', { opacity: 0, duration: 0.28 }, '-=0.28')
      .to('.gsap-bar', { opacity: 0, y: -8, duration: 0.28 }, '-=0.28')
      .to('.field, .noise', { opacity: 0, duration: 0.45 }, '-=0.25');
